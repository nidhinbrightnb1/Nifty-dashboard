<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty ORB Dashboard</title>
    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>📊 Nifty ORB Status</h2>
    
    <div class="card">
        <h3>Current Position</h3>
        <p id="position-text">FLAT</p>
        <h3>ORB Levels</h3>
        <p>High: <span id="orb-high">--</span> | Low: <span id="orb-low">--</span></p>
    </div>

    <button onclick="sendDataToBot('START')">▶️ Start Trading</button>
    <button style="background-color: #e53935;" onclick="sendDataToBot('STOP')">🛑 Stop Trading</button>
    <button style="background-color: #43a047;" onclick="sendDataToBot('CLOSE_ALL')">💰 Square Off All</button>

    <script>
        // Initialize the Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Expands the popup to full screen

        function sendDataToBot(command) {
            // Sends data back to your Python script
            let data = JSON.stringify({ action: command });
            tg.sendData(data);
        }
    </script>
</body>
</html>
